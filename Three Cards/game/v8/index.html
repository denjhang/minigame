<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Three Cards v8 - 三张消消乐 (v8 增强版)</title>
    <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
    <div id="app">
        <header class="top-bar">
            <div class="title-box">
                <h1 class="game-title">Three Cards <span class="muted" style="font-size:12px">(v8 增强版)</span></h1>
                <p class="game-sub">三张相同即可消除</p>
            </div>
            <span class="icon-hint" title="点击卡牌有音效">🔊</span>
        </header>
        <main class="board-wrap">
            <div class="board" id="board"></div>
            <div class="slot-row" id="slot-row"></div>
        </main>
        <section class="tools">
            <button class="tool" data-tool="pop"><span class="tool-name">弹出</span><span class="tool-count" id="cnt-pop">3</span></button>
            <button class="tool" data-tool="undo"><span class="tool-name">撤销</span><span class="tool-count" id="cnt-undo">3</span></button>
            <button class="tool" data-tool="wash"><span class="tool-name">洗牌</span><span class="tool-count" id="cnt-wash">3</span></button>
        </section>
        <section class="info">
            <div class="stat"><span>关卡</span><b id="lv">1</b></div>
            <div class="stat"><span>得分</span><b id="score">0</b></div>
            <div class="stat"><span>评分</span><b id="rating" class="rating">0</b></div>
            <div class="stat"><span>最高分</span><b id="bestScore" class="gold">0</b></div>
            <div class="stat"><span>剩余</span><b id="remain">0</b></div>
            <div class="stat"><span>用时</span><b id="time">0秒</b></div>
            <div class="stat"><span>可解</span><b id="solvable" class="good">✔</b></div>
        </section>
        <section class="actions">
            <button class="btn" id="btn-next">下一关</button>
            <button class="btn" id="btn-restart">重开本关</button>
        </section>
    </div>
    <div class="modal-mask" id="modal" hidden>
        <div class="modal">
            <h2 id="modal-title">通关!</h2>
            <p id="modal-desc"></p>
            <div class="modal-actions">
                <button class="btn" id="modal-ok">确定</button>
                <button class="btn" id="modal-retry">再来一次</button>
            </div>
        </div>
    </div>
    <script src="core.js"></script>
    <script src="levels.js"></script>
    <script src="game.js"></script>
</body>
</html>
