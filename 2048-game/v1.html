<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048 小游戏</title>
<style>
  /* ===== 基础重置 ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ===== 游戏容器 ===== */
  #game-wrap {
    position: relative;
    width: min(420px, 92vw);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ===== 头部信息 ===== */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
  }

  .game-header .title {
    font-size: 26px;
    letter-spacing: 2px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }

  .game-header .score-box,
  .game-header .best-box {
    background: rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    padding: 8px 16px;
    text-align: center;
    backdrop-filter: blur(4px);
  }

  .game-header .best-box {
    font-size: 14px;
    color: #ffd54f;
    border: 1px solid rgba(255, 213, 79, 0.4);
  }
  /* 头部按钮与分数牌间距 */
  .game-header {
    padding-right: 120px;
  }

  /* ===== 分数按钮 ===== */
  .score-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.2s;
    backdrop-filter: blur(4px);
  }
  .score-btn:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.28);
  }
  .score-btn.restart {
    background: rgba(255, 165, 0, 0.28);
    font-size: 20px;
  }
  .score-btn.restart:active {
    background: rgba(255, 165, 0, 0.42);
  }

  /* ===== 游戏棋盘 ===== */
  #board-container {
    position: relative;
    padding: 0 8px;
  }

  #board {
    position: relative;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.22);
    border: 2px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    aspect-ratio: 1 / 1;
    touch-action: none;
  }

  /* 静态背景格子（棋盘底色） */
  .cell-bg {
    position: absolute;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
  }

  /* 数字块：位置用 translate 表达，便于做平滑过渡 */
  .tile {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(20px, 7.5vw, 44px);
    border-radius: 10px;
    transition: transform 0.12s ease;
    will-change: transform;
  }

  /* 各数字配色 */
  .c-2 { background: linear-gradient(135deg, #ee7aa7 0%, #e0657a 100%); color: #fff; }
  .c-4 { background: linear-gradient(135deg, #ffd166 0%, #f4a93c 100%); color: #fff; }
  .c-8 { background: linear-gradient(135deg, #69db7c 0%, #4bb972 100%); color: #fff; }
  .c-16 { background: linear-gradient(135deg, #f0c864 0%, #c79a3a 100%); color: #fff; }
  .c-32 { background: linear-gradient(135deg, #4dabf7 0%, #2a8cd6 100%); color: #fff; }
  .c-64 { background: linear-gradient(135deg, #9775fa 0%, #7b5fe0 100%); color: #fff; }
  .c-128 { background: linear-gradient(135deg, #ff9ff3 0%, #e866bb 100%); color: #fff; font-size: clamp(18px, 6.5vw, 38px); }
  .c-256 { background: linear-gradient(135deg, #f8c83f 0%, #d99e1f 100%); color: #fff; font-size: clamp(18px, 6.5vw, 38px); }
  .c-512 { background: linear-gradient(135deg, #c792ea 0%, #b070d0 100%); color: #fff; font-size: clamp(16px, 6vw, 34px); }
  .c-1024 { background: linear-gradient(135deg, #f77979 0%, #e04e4e 100%); color: #fff; font-size: clamp(14px, 5.2vw, 30px); }
  .c-2048 { background: linear-gradient(135deg, #fad200 0%, #e08a00 100%); color: #fff; font-size: clamp(14px, 5.2vw, 30px); box-shadow: 0 0 18px rgba(250, 180, 0, 0.7); }
  .c-super { background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%); color: #3d2b00; font-size: clamp(12px, 4.6vw, 26px); box-shadow: 0 0 24px rgba(255, 215, 0, 0.85); }

  /* 新生成数字动画：在 translate 定位基础上叠加 scale */
  .tile.new {
    animation: popIn 0.18s ease 0.12s backwards;
  }
  @keyframes popIn {
    0% { transform: translate(var(--tx), var(--ty)) scale(0); }
    60% { transform: translate(var(--tx), var(--ty)) scale(1.12); }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); }
  }

  /* 合并动画 */
  .tile.merged {
    animation: mergePop 0.16s ease 0.12s backwards;
  }
  @keyframes mergePop {
    0% { transform: translate(var(--tx), var(--ty)) scale(1); }
    60% { transform: translate(var(--tx), var(--ty)) scale(1.15); }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); }
  }

  /* 分数飘字 */
  .score-float {
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    color: #fff;
    font-size: 26px;
    font-weight: 800;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    z-index: 5;
    animation: floatUp 0.8s ease forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateX(-50%) translateY(0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-48px); }
  }

  /* 游戏结束遮罩 */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(20, 20, 30, 0.82);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    z-index: 10;
    color: #fff;
    text-align: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay h2 {
    font-size: clamp(28px, 9vw, 44px);
    margin-bottom: 12px;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
  }
  .overlay p {
    font-size: clamp(14px, 4vw, 18px);
    margin-bottom: 22px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.9);
  }
  .overlay .btn {
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff6b6b, #ee5253);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(238, 82, 83, 0.4);
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .overlay .btn:active {
    transform: scale(0.95);
    box-shadow: 0 3px 10px rgba(238, 82, 83, 0.4);
  }
  .overlay .hint {
    margin-top: 18px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
  }

  /* 操作提示 */
  .game-footer {
    padding: 12px 20px 4px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    text-align: center;
  }

  /* 移动端适配 */
  @media (max-width: 480px) {
    #game-wrap {
      width: 94vw;
      max-width: 420px;
    }
    .game-header {
      font-size: 15px;
      padding: 14px 16px;
    }
    .game-header .title {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<div id="game-wrap">
  <!-- 头部 -->
  <div class="game-header">
    <div class="title">2048</div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="score-box" id="score">分数：0</div>
      <div class="best-box" id="best">最高：0</div>
    </div>
  </div>

  <!-- 按钮 -->
  <button class="score-btn restart" id="restart" style="position:absolute;top:14px;right:14px;" title="重新开始">↺</button>
  <button class="score-btn" id="sound-btn" style="position:absolute;top:14px;right:68px;" title="音效开关">🔊</button>

  <!-- 棋盘 -->
  <div id="board-container">
    <div id="board"></div>

    <!-- 遮罩 -->
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">游戏结束</h2>
      <p id="overlay-text">当前分数无法继续，<br>再接再厉，挑战更高分数！</p>
      <button class="btn" id="overlay-btn">重新开始</button>
      <div class="hint">提示：方向键 / 滑动 控制移动</div>
    </div>
  </div>

  <div class="game-footer">方向键 或 滑动屏幕 移动方块 · 相同数字合并翻倍</div>
</div>

<script>
(function () {
  "use strict";

  // ===== 游戏配置 =====
  var SIZE = 4;                       // 4x4 棋盘
  var GAP_RATIO = 0.14;               // 间隙与格子尺寸比例
  var ANIM_MS = 120;                  // 移动动画时长（与 CSS transition 一致）
  var CELLS_COLORS = [
    "",                       // 0
    "c-2", "c-4", "c-8", "c-16",
    "c-32", "c-64", "c-128",
    "c-256", "c-512", "c-1024", "c-2048",
    "c-super"                   // 4096 及以上
  ];

  // ===== DOM 元素 =====
  var boardEl = document.getElementById("board");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var restartBtn = document.getElementById("restart");
  var soundBtn = document.getElementById("sound-btn");
  var overlayEl = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlayText = document.getElementById("overlay-text");
  var overlayBtn = document.getElementById("overlay-btn");

  // ===== 状态 =====
  var cellPx = 0;                    // 单元格边长
  var gapPx = 0;                     // 间隙宽度
  var grid = [];                     // 棋盘数据：grid[r][c] = Tile | null
  var score = 0;
  var bestScore = Number(localStorage.getItem("2048_best") || 0);
  var isAnimating = false;           // 动画进行中，禁止操作
  var isGameOver = false;
  var tileId = 0;                    // 方块唯一 id
  var soundOn = localStorage.getItem("2048_sound") !== "0";
  var audioCtx = null;

  // 初始化最佳分数与音效按钮显示
  bestEl.textContent = "最高：" + bestScore;
  soundBtn.textContent = soundOn ? "🔊" : "🔇";

  // ===== 尺寸计算：保证 4 个格子 + 间隙完整显示在棋盘内 =====
  function measureBoard() {
    // #board 有 2px 边框，clientWidth 为不含边框的内区尺寸
    var boardInner = boardEl.clientWidth - 4;
    // 布局：padding(8) + 4*cell + 3*gap，其中 gap = cell * GAP_RATIO
    // => 4*cell * (1 + GAP_RATIO) + 2*GAP = boardInner
    var pad = 8;
    cellPx = (boardInner - 2 * pad) / (SIZE * (1 + GAP_RATIO) + 2 * GAP_RATIO);
    gapPx = cellPx * GAP_RATIO;
    return cellPx > 0;
  }

  // 格子 (r, c) 左上角相对棋盘的像素位置
  function cellPos(r, c) {
    return {
      x: 8 + c * (cellPx + gapPx),
      y: 8 + r * (cellPx + gapPx)
    };
  }

  // ===== 方块模型 =====
  function createTile(r, c, val) {
    return {
      id: ++tileId,
      val: val,
      r: r,
      c: c,
      el: null,
      isNew: false,
      isMerged: false
    };
  }

  function tileColorClass(val) {
    if (val <= 0) return "";
    var idx = Math.min(Math.log2(val), CELLS_COLORS.length - 1);
    return CELLS_COLORS[idx];
  }

  function createTileEl(tile) {
    var el = document.createElement("div");
    el.className = "tile " + tileColorClass(tile.val);
    el.style.width = cellPx + "px";
    el.style.height = cellPx + "px";
    el.textContent = tile.val;
    tile.el = el;
    return el;
  }

  // 更新方块位置（translate，触发 CSS 过渡产生滑动动画）
  function setTilePos(tile, r, c) {
    var p = cellPos(r, c);
    tile.r = r;
    tile.c = c;
    tile.el.style.setProperty("--tx", p.x + "px");
    tile.el.style.setProperty("--ty", p.y + "px");
    tile.el.style.transform = "translate(" + p.x + "px, " + p.y + "px)";
  }

  // ===== 重建棋盘 DOM（仅背景格，方块层整体清空） =====
  function buildBoard() {
    boardEl.innerHTML = "";
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var p = cellPos(r, c);
        var bg = document.createElement("div");
        bg.className = "cell-bg";
        bg.style.width = cellPx + "px";
        bg.style.height = cellPx + "px";
        bg.style.left = p.x + "px";
        bg.style.top = p.y + "px";
        boardEl.appendChild(bg);
      }
    }
    // 重新挂载现有方块（保持对象引用不变）
    for (var r2 = 0; r2 < SIZE; r2++) {
      for (var c2 = 0; c2 < SIZE; c2++) {
        var t = grid[r2][c2];
        if (t && t.el) {
          t.el.style.width = cellPx + "px";
          t.el.style.height = cellPx + "px";
          setTilePos(t, t.r, t.c);
          boardEl.appendChild(t.el);
        }
      }
    }
  }

  // 挂载新方块到棋盘，可选播放弹出/合并动画
  function mountTile(tile, withAnim) {
    var el = tile.el || createTileEl(tile);
    if (withAnim) {
      el.classList.add(tile.isMerged ? "merged" : "new");
      tile.isNew = false;
      tile.isMerged = false;
    }
    setTilePos(tile, tile.r, tile.c);
    boardEl.appendChild(el);
  }

  // ===== 初始化 =====
  function initGame() {
    isAnimating = false;
    isGameOver = false;
    score = 0;
    grid = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) row.push(null);
      grid.push(row);
    }
    updateScore();
    measureBoard();
    buildBoard();
    addRandomNumber();
    addRandomNumber();
    hideOverlay();
  }

  // 更新分数显示
  function updateScore() {
    scoreEl.textContent = "分数：" + score;
    if (score > bestScore) {
      bestScore = score;
      bestEl.textContent = "最高：" + bestScore;
      localStorage.setItem("2048_best", String(bestScore));
    }
  }

  // 分数飘字
  function floatScore(points) {
    var el = document.createElement("div");
    el.className = "score-float";
    el.textContent = "+" + points;
    boardEl.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 800);
  }

  // ===== 音效（WebAudio 合成，无需外部资源） =====
  function beep(freq, dur, type, vol) {
    if (!soundOn) return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* 忽略音频错误 */ }
  }
  function playMove() { beep(320, 0.06, "triangle", 0.05); }
  function playMerge() { beep(540, 0.09, "sine", 0.07); beep(720, 0.09, "sine", 0.05); }
  function playSpawn() { beep(240, 0.05, "sine", 0.04); }

  // ===== 生成随机方块 =====
  function addRandomNumber() {
    var empty = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empty.push([r, c]);
      }
    }
    if (empty.length === 0) return;

    var pos = empty[Math.floor(Math.random() * empty.length)];
    var val = Math.random() < 0.9 ? 2 : 4;
    var tile = createTile(pos[0], pos[1], val);
    tile.isNew = true;
    grid[tile.r][tile.c] = tile;
    mountTile(tile, true);
    playSpawn();
  }

  // ===== 移动逻辑（含滑动过渡动画） =====
  function move(direction) {
    if (isAnimating || isGameOver) return;

    // 方向 -> 遍历顺序：从靠近目标边缘的一侧开始处理
    // 遍历顺序：靠近目标边缘的行列先处理（保证"先处理者合并"的规则正确）
    var rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
    if (direction === "down") rows.reverse();
    if (direction === "left") cols.reverse();
    if (direction === "right") cols.reverse();

    var moved = false;
    var gained = 0;
    var mergedAny = false;

    for (var ri = 0; ri < SIZE; ri++) {
      for (var ci = 0; ci < SIZE; ci++) {
        var r = rows[ri], c = cols[ci];
        var tile = grid[r][c];
        if (!tile) continue;

        // 沿方向找最近的非空格
        var cr = r, cc = c;
        var stepR = direction === "up" ? -1 : direction === "down" ? 1 : 0;
        var stepC = direction === "left" ? -1 : direction === "right" ? 1 : 0;
        var nr = cr + stepR, nc = cc + stepC;
        var neighbor = null;
        while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
          if (grid[nr][nc]) { neighbor = { r: nr, c: nc, tile: grid[nr][nc] }; break; }
          nr += stepR;
          nc += stepC;
        }

        if (neighbor && neighbor.tile.val === tile.val && !neighbor.tile.isMerged) {
          // 合并：移动方块滑向目标，目标升级为 2 倍，随后移除滑入的方块
          var target = neighbor.tile;
          grid[r][c] = null;
          setTilePos(tile, neighbor.r, neighbor.c);
          target.val = tile.val * 2;
          target.isMerged = true;
          gained += target.val;
          mergedAny = true;
          moved = true;
        } else if (neighbor) {
          // 前方已有不同值方块：停在紧邻位置
          var sr = neighbor.r - stepR;
          var sc = neighbor.c - stepC;
          if (sr !== r || sc !== c) {
            grid[r][c] = null;
            setTilePos(tile, sr, sc);
            grid[sr][sc] = tile;
            moved = true;
          }
        } else {
          // 一路滑到边缘
          var er = r, ec = c;
          while (true) {
            var tr2 = er + stepR, tc2 = ec + stepC;
            if (tr2 < 0 || tr2 >= SIZE || tc2 < 0 || tc2 >= SIZE) break;
            er = tr2;
            ec = tc2;
          }
          if (er !== r || ec !== c) {
            grid[r][c] = null;
            setTilePos(tile, er, ec);
            grid[er][ec] = tile;
            moved = true;
          }
        }
      }
    }

    if (!moved) return;

    isAnimating = true;
    if (mergedAny) playMerge(); else playMove();
    if (gained > 0) {
      score += gained;
      updateScore();
      floatScore(gained);
    }

    // 等待滑动过渡结束后：移除被合并的方块、生成新方块、检测结束
    setTimeout(function () {
      // 清理被合并（滑入后升级）的方块
      for (var r = 0; r < SIZE; r++) {
        for (var c = 0; c < SIZE; c++) {
          var t = grid[r][c];
          if (t && t.isMerged) {
            t.el.classList.remove("merged");
            t.el.textContent = t.val;
            t.el.className = "tile " + tileColorClass(t.val) + (t.val === 2048 ? " win-glow" : "");
            t.isMerged = false;
          }
        }
      }
      addRandomNumber();
      isAnimating = false;
      if (checkGameOver()) {
        isGameOver = true;
        showOverlay("游戏结束", "当前分数无法继续，<br>再接再厉，挑战更高分数！");
      }
    }, ANIM_MS + 30);
  }

  // 检查游戏是否结束
  function checkGameOver() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return false;
        var val = grid[r][c].val;
        if (c + 1 < SIZE && grid[r][c + 1].val === val) return false;
        if (r + 1 < SIZE && grid[r + 1][c].val === val) return false;
      }
    }
    return true;
  }

  // ===== 覆盖层 =====
  function showOverlay(title, text) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = text.replace(/\n/g, "<br>");
    overlayEl.classList.add("show");
  }
  function hideOverlay() {
    overlayEl.classList.remove("show");
  }

  // ===== 输入：方向键 =====
  document.addEventListener("keydown", function (e) {
    var map = {
      ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
      w: "up", s: "down", a: "left", d: "right"
    };
    var dir = map[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  // ===== 输入：滑动（鼠标 + 触摸统一用 Pointer 事件） =====
  var slideThreshold = 24;
  var slideStart = null;
  var slideDir = null;

  function onPointerDown(e) {
    if (isAnimating || isGameOver) return;
    slideStart = { x: e.clientX, y: e.clientY };
    slideDir = null;
  }
  function onPointerMove(e) {
    if (!slideStart) return;
    var dx = e.clientX - slideStart.x;
    var dy = e.clientY - slideStart.y;
    var absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) > slideThreshold) {
      slideDir = (absX > absY) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    }
  }
  function onPointerUp() {
    if (slideStart && slideDir) move(slideDir);
    slideStart = null;
    slideDir = null;
  }

  boardEl.addEventListener("pointerdown", onPointerDown);
  boardEl.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);

  // ===== 按钮 =====
  function restartGame() {
    initGame();
  }
  restartBtn.addEventListener("click", restartGame);
  overlayBtn.addEventListener("click", restartGame);

  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    localStorage.setItem("2048_sound", soundOn ? "1" : "0");
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    if (soundOn) playSpawn();
  });

  // ===== 窗口尺寸变化：重建棋盘（方块按原数据重新定位） =====
  window.addEventListener("resize", function () {
    if (!measureBoard()) return;
    buildBoard();
  });

  // ===== 启动 =====
  initGame();
})();
</script>
</body>
</html>
