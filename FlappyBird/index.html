<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a2e;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    border: 4px solid #16213e;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// ---------- 画面尺寸 ----------
const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;
// 逻辑坐标：x 从左到右 0..W，y 从上到下 0..H（重力向下，y 增大）

// ---------- 物理参数（每帧，60fps 基准） ----------
const GRAVITY = 0.45;        // 重力加速度（向下为正，y 增大）
const FLAP_VY = -7.5;        // 跳跃初速度（向上为负，y 减小）
const MAX_FALL = 10;         // 最大下落速度（终端速度）

// ---------- 管道参数 ----------
const PIPE_W = 64;           // 管道宽度
const PIPE_GAP = 150;        // 上下管道之间的开口高度
const PIPE_SPACING = 240;    // 相邻管道的水平间距
const PIPE_SPEED_BASE = 2.6; // 基础移动速度（px/frame）
const PIPE_SPEED_MAX = 4.2;  // 最大移动速度（随分数递增的上限）

// ---------- 碰撞盒 ----------
const BIRD_R = 10;           // 碰撞半径
const BIRD_DRAW_R = 12;      // 视觉半径（比碰撞盒大一点，看起来更圆润）

// ---------- 难度曲线 ----------
function pipeSpeed(score) {
  // 每 5 分加速 0.15，封顶 PIPE_SPEED_MAX
  const s = PIPE_SPEED_BASE + Math.floor(score / 5) * 0.15;
  return Math.min(s, PIPE_SPEED_MAX);
}

// ---------- 状态机 ----------
// state: "idle" | "playing" | "gameover"
let state = "idle";

// ---------- 鸟 ----------
let birdY = H / 2;
let birdVy = 0;

// ---------- 管道 ----------
// 每根管道: { x, gapY }  gapY 是开口中心的 y
let pipes = [];
let lastPipeX = 0;

// ---------- 分数 ----------
let score = 0;
let best = 0;

// ---------- 地面 ----------
const GROUND_H = 80;
const GROUND_Y = H - GROUND_H;  // 地面顶部 y 坐标
let groundOffset = 0;

// ---------- 工具 ----------
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function randRange(a, b) { return a + Math.random() * (b - a); }

// ---------- 重置 ----------
function reset() {
  birdY = H / 2;
  birdVy = 0;
  pipes = [];
  lastPipeX = W + 100;
  score = 0;
  groundOffset = 0;
}

// ---------- 输入 ----------
function flap() {
  if (state === "idle") {
    state = "playing";
    reset();
    birdY = H / 2;
    birdVy = FLAP_VY;
  } else if (state === "playing") {
    birdVy = FLAP_VY;
  } else if (state === "gameover") {
    // 点击重开
    state = "idle";
    reset();
    birdY = H / 2;
  }
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener("mousedown", flap);
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); flap(); }, { passive: false });

// ---------- 每帧更新 ----------
function update() {
  if (state === "idle") {
    // 待机时地面滚动，鸟轻微浮动
    groundOffset = (groundOffset + PIPE_SPEED_BASE) % 48;
    birdY = H / 2 + Math.sin(Date.now() / 300) * 6;
    return;
  }

  if (state === "gameover") {
    return;
  }

  // --- playing ---
  // 鸟的物理
  birdVy += GRAVITY;
  if (birdVy > MAX_FALL) birdVy = MAX_FALL;
  birdY += birdVy;

  // 地面滚动
  const spd = pipeSpeed(score);
  groundOffset = (groundOffset + spd) % 48;

  // 管道移动
  for (const p of pipes) {
    p.x -= spd;
  }

  // 移除出屏管道
  pipes = pipes.filter(p => p.x + PIPE_W > -10);

  // 生成新管道
  const rightmost = pipes.length > 0 ? pipes[pipes.length - 1].x : lastPipeX;
  if (rightmost - W < PIPE_SPACING) {
    // 开口中心 y：确保开口不贴地也不贴顶
    // 开口顶部 >= 60，开口底部 <= GROUND_Y - 60
    const minGapY = 60 + PIPE_GAP / 2;
    const maxGapY = GROUND_Y - 60 - PIPE_GAP / 2;
    const gapY = randRange(minGapY, maxGapY);
    const newX = rightmost + PIPE_SPACING;
    pipes.push({ x: newX, gapY: gapY });
    lastPipeX = newX;
  }

  // 计分：管道中心经过鸟的 x 时加 1 分
  for (const p of pipes) {
    const pipeCenterX = p.x + PIPE_W / 2;
    if (!p.scored && pipeCenterX < W * 0.5) {
      p.scored = true;
      score++;
      if (score > best) best = score;
    }
  }

  // --- 碰撞检测 ---
  // 1) 天花板
  if (birdY - BIRD_R < 0) {
    birdY = BIRD_R;
    birdVy = 0;
    // 撞到顶不死，只卡住（经典 Flappy 行为）
  }

  // 2) 地面
  if (birdY + BIRD_R >= GROUND_Y) {
    birdY = GROUND_Y - BIRD_R;
    state = "gameover";
    return;
  }

  // 3) 管道（圆形 vs 矩形碰撞）
  const birdX = W * 0.3;  // 鸟的 x 固定
  for (const p of pipes) {
    // 鸟是否在管道的 x 范围内
    if (birdX + BIRD_R > p.x && birdX - BIRD_R < p.x + PIPE_W) {
      const gapTop = p.gapY - PIPE_GAP / 2;
      const gapBottom = p.gapY + PIPE_GAP / 2;
      // 鸟的 y 在开口之外 → 撞
      if (birdY - BIRD_R < gapTop || birdY + BIRD_R > gapBottom) {
        state = "gameover";
        return;
      }
    }
  }
}

// ---------- 绘制 ----------
function draw() {
  // --- 天空 ---
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, "#4ec0ca");
  skyGrad.addColorStop(1, "#87ceeb");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // --- 远山（装饰）---
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  for (let i = 0; i < 4; i++) {
    const mx = ((i * 140 - groundOffset * 0.3) % (W + 140) + W + 140) % (W + 140) - 70;
    ctx.beginPath();
    ctx.ellipse(mx, GROUND_Y - 20, 90, 50, 0, Math.PI, 0);
    ctx.fill();
  }

  // --- 管道 ---
  for (const p of pipes) {
    drawPipe(p.x, 0, p.gapY - PIPE_GAP / 2, true);        // 上管道
    drawPipe(p.x, p.gapY + PIPE_GAP / 2, GROUND_Y, false); // 下管道
  }

  // --- 地面 ---
  ctx.fillStyle = "#ded895";
  ctx.fillRect(0, GROUND_Y, W, GROUND_H);
  // 地面草边
  ctx.fillStyle = "#73bf2e";
  ctx.fillRect(0, GROUND_Y, W, 12);
  // 地面纹理（斜条纹，滚动）
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  for (let x = -48; x < W + 48; x += 48) {
    const ox = x - groundOffset;
    ctx.beginPath();
    ctx.moveTo(ox, GROUND_Y + 12);
    ctx.lineTo(ox + 24, GROUND_Y);
    ctx.lineTo(ox + 48, GROUND_Y);
    ctx.lineTo(ox + 24, GROUND_Y + 12);
    ctx.closePath();
    ctx.fill();
  }

  // --- 鸟 ---
  drawBird();

  // --- UI ---
  if (state === "idle") {
    drawCenterText("Flappy Bird", 180, 32, "#fff", true);
    drawCenterText("Press SPACE or Click to Start", 300, 16, "#fff", false);
    drawCenterText("Arrow Up also works", 325, 13, "rgba(255,255,255,0.7)", false);
  } else if (state === "playing") {
    drawScore();
  } else if (state === "gameover") {
    drawScore();
    drawGameOver();
  }
}

function drawPipe(x, y, h, isTop) {
  if (h <= 0) return;
  const PIPE_COLOR = "#73bf2e";
  const PIPE_DARK = "#5a9e1e";
  const PIPE_LIGHT = "#9ce05c";
  const CAP_H = 24;  // 管道帽高度

  ctx.fillStyle = PIPE_COLOR;
  ctx.fillRect(x, y, PIPE_W, h);

  // 左侧高光
  ctx.fillStyle = PIPE_LIGHT;
  ctx.fillRect(x + 4, y, 6, h);
  // 右侧阴影
  ctx.fillStyle = PIPE_DARK;
  ctx.fillRect(x + PIPE_W - 10, y, 6, h);

  // 管道帽
  let capY;
  if (isTop) {
    capY = y + h - CAP_H;  // 帽在底部（朝下）
  } else {
    capY = y;              // 帽在顶部（朝上）
  }
  ctx.fillStyle = PIPE_COLOR;
  ctx.fillRect(x - 4, capY, PIPE_W + 8, CAP_H);
  ctx.fillStyle = PIPE_LIGHT;
  ctx.fillRect(x - 4 + 4, capY, 6, CAP_H);
  ctx.fillStyle = PIPE_DARK;
  ctx.fillRect(x + PIPE_W - 10 + 4, capY, 6, CAP_H);
  // 帽子边框
  ctx.strokeStyle = "#3d7a12";
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 4, capY, PIPE_W + 8, CAP_H);
}

function drawBird() {
  const birdX = W * 0.3;
  const r = BIRD_DRAW_R;

  // 身体（圆形）
  ctx.fillStyle = "#f7d51d";
  ctx.beginPath();
  ctx.arc(birdX, birdY, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#c9a800";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 翅膀（椭圆形，根据速度上下摆动）
  const wingOffset = birdVy > 0 ? 3 : -2;
  ctx.fillStyle = "#f0c040";
  ctx.beginPath();
  ctx.ellipse(birdX - 2, birdY + 2 + wingOffset, 7, 5, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // 眼睛（白色 + 黑色瞳孔）
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(birdX + 4, birdY - 3, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(birdX + 5.5, birdY - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // 嘴（橙色三角）
  ctx.fillStyle = "#f5722e";
  ctx.beginPath();
  ctx.moveTo(birdX + r - 2, birdY);
  ctx.lineTo(birdX + r + 7, birdY + 1);
  ctx.lineTo(birdX + r - 2, birdY + 5);
  ctx.closePath();
  ctx.fill();
}

function drawScore() {
  // 分数居中顶部
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 4;
  ctx.font = "bold 42px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.strokeText(score, W / 2, 24);
  ctx.fillText(score, W / 2, 24);
}

function drawCenterText(text, y, size, color, isTitle) {
  ctx.fillStyle = color;
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = isTitle ? 5 : 3;
  ctx.font = (isTitle ? "bold " : "") + size + "px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.strokeText(text, W / 2, y);
  ctx.fillText(text, W / 2, y);
}

function drawGameOver() {
  // 半透明遮罩
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, W, H);

  // 面板
  const panelW = 280, panelH = 160;
  const px = (W - panelW) / 2, py = (H - panelH) / 2 - 20;
  ctx.fillStyle = "#ded895";
  roundRect(px, py, panelW, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "#c9b458";
  ctx.lineWidth = 4;
  roundRect(px, py, panelW, panelH, 12);
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // 标题
  ctx.fillStyle = "#e85d4a";
  ctx.font = "bold 28px 'Courier New', monospace";
  ctx.fillText("Game Over", W / 2, py + 36);

  // 分数
  ctx.fillStyle = "#5a4a2a";
  ctx.font = "16px 'Courier New', monospace";
  ctx.fillText("Score: " + score, W / 2, py + 72);
  ctx.fillText("Best:  " + best, W / 2, py + 96);

  // 提示
  ctx.fillStyle = "#8a7a5a";
  ctx.font = "13px 'Courier New', monospace";
  ctx.fillText("Click or press SPACE to restart", W / 2, py + 132);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 主循环 ----------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
