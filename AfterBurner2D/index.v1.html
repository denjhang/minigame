<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Striker 3D</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a1420; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; }
  #hud {
    position: absolute; left: 16px; top: 12px; z-index: 10;
    font: 15px/1.6 "Consolas", monospace; color: #cfeaff;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); user-select: none; pointer-events: none;
    white-space: pre;
  }
  #msg {
    position: absolute; left: 50%; top: 36%; transform: translate(-50%,-50%);
    z-index: 11; font: 700 26px/1.5 "Consolas", monospace; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,.7); text-align: center; user-select: none;
    pointer-events: none; white-space: pre;
  }
  #lockbox {
    position: absolute; left: 50%; top: 52%; width: 46px; height: 46px;
    margin: -23px 0 0 -23px; z-index: 9; display: none;
    border: 2px solid #ff5555; box-shadow: 0 0 8px rgba(255,60,60,.6);
    user-select: none; pointer-events: none;
  }
  #lockbox small {
    position: absolute; top: -20px; width: 100%; text-align: center;
    font: 700 12px "Consolas", monospace; color: #ff8888;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"></div>
  <div id="msg"></div>
  <div id="lockbox"><small>LOCK</small></div>
</div>
<script src="three.min.js"></script>
<script>
"use strict";
// =====================================================================
// Sky Striker 3D —— 现代 3D 空战
// 场景：渐变天空 + 太阳 + 云 + 海洋 + 岛屿（陆地/山/树/房子/河流）
//       航空母舰 + 玩家战机 + 敌机 + 机枪/锁定导弹 + 补给机
// 视角：第三人称后置追机镜头
// =====================================================================

// ---------- 状态机 ----------
let STATE = "TITLE";   // TITLE -> TAKEOFF -> PLAYING -> GAMEOVER

// ---------- 渲染器/相机 ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xcfe3f2, 0.00038);
const camera = new THREE.PerspectiveCamera(64, 1, 0.5, 9000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById("wrap").appendChild(renderer.domElement);

// ---------- 天空（渐变球：天顶蓝 → 地平线暖白） ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(7000, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      top:     { value: new THREE.Color(0x1e63b8) },
      mid:     { value: new THREE.Color(0x6fa8d8) },
      horizon: { value: new THREE.Color(0xe8f1f5) },
    },
    vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `
      uniform vec3 top,mid,horizon; varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 c = mix(horizon, mid, smoothstep(0.,0.22,clamp(h,0.,1.)));
        c = mix(c, top, smoothstep(0.22,0.7,clamp(h,0.,1.)));
        gl_FragColor = vec4(c,1.);
      }`,
  })
);
sky.frustumCulled = false;
scene.add(sky);

// ---------- 太阳（发光圆盘 + 光晕） ----------
const sunDir = new THREE.Vector3(0.55, 0.42, -0.72).normalize();
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(180, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xfff3c0, fog: false })
);
sunMesh.position.copy(sunDir).multiplyScalar(6000);
scene.add(sunMesh);
const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(340, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xfff8dc, transparent: true, opacity: 0.28, fog: false })
);
sunGlow.position.copy(sunMesh.position);
scene.add(sunGlow);

// ---------- 光照 ----------
const sunLight = new THREE.DirectionalLight(0xfff0d0, 1.5);
sunLight.position.copy(sunDir).multiplyScalar(1000);
scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0xbddcf0, 0x3a6a8a, 0.7)); // 天光/海反光

// ---------- 海洋 ----------
const ocean = new THREE.Mesh(
  new THREE.PlaneGeometry(40000, 40000),
  new THREE.MeshLambertMaterial({ color: 0x2a6d99 })
);
ocean.rotation.x = -Math.PI / 2;
ocean.position.y = 0;
scene.add(ocean);

// ---------- 云（蓬松的球团，缓慢漂移） ----------
const clouds = [];
function makeCloud(x, y, z) {
  const c = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
  const n = 4 + (Math.random() * 4 | 0);
  for (let i = 0; i < n; i++) {
    const s = 28 + Math.random() * 40;
    const p = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), mat);
    p.position.set((Math.random() - 0.5) * s * 2.4, (Math.random() - 0.5) * s * 0.7, (Math.random() - 0.5) * s * 1.6);
    p.scale.y = 0.55;
    c.add(p);
  }
  c.position.set(x, y, z);
  scene.add(c);
  clouds.push(c);
}
for (let i = 0; i < 14; i++) {
  makeCloud((Math.random() - 0.5) * 4000, 260 + Math.random() * 220, (Math.random() - 0.5) * 4000);
}

// ---------- 岛屿生成（陆地 + 山 + 树 + 房子 + 河流） ----------
const islands = [];
const treeMat = new THREE.MeshLambertMaterial({ color: 0x2d6b3a, flatShading: true });
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2a });
const houseMat = new THREE.MeshLambertMaterial({ color: 0xd8c8a8, flatShading: true });
const roofMat = new THREE.MeshLambertMaterial({ color: 0x8a4a3a, flatShading: true });
const rockMat = new THREE.MeshLambertMaterial({ color: 0x7a7f85, flatShading: true });
const sandMat = new THREE.MeshLambertMaterial({ color: 0xd8c89a });
const grassMat = new THREE.MeshLambertMaterial({ color: 0x4a8a55 });

function makeIsland(cx, cz, size) {
  const isl = new THREE.Group();
  // 沙滩环岛
  const beach = new THREE.Mesh(new THREE.CylinderGeometry(size * 1.15, size * 1.25, 6, 10), sandMat);
  beach.position.y = 2;
  isl.add(beach);
  // 草地主体
  const land = new THREE.Mesh(new THREE.CylinderGeometry(size, size * 1.1, 8, 10), grassMat);
  land.position.y = 3;
  isl.add(land);
  // 山脉（2~4 座圆锥）
  const nMtn = 2 + (Math.random() * 3 | 0);
  for (let i = 0; i < nMtn; i++) {
    const h = 40 + Math.random() * size * 0.9;
    const r = h * 0.55;
    const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), rockMat);
    const a = Math.random() * Math.PI * 2, d = Math.random() * size * 0.5;
    m.position.set(cx + Math.sin(a) * d, h / 2 + 6, cz + Math.cos(a) * d);
    isl.add(m);
    // 山顶积雪
    if (h > 80) {
      const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.35, h * 0.22, 7),
        new THREE.MeshLambertMaterial({ color: 0xf0f5f8 }));
      cap.position.set(m.position.x, m.position.y + h * 0.39, m.position.z);
      isl.add(cap);
    }
  }
  // 树林
  const nTree = 8 + (size / 20 | 0);
  for (let i = 0; i < nTree; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.random() * size * 0.85;
    const x = cx + Math.sin(a) * d, z = cz + Math.cos(a) * d;
    const th = 6 + Math.random() * 9;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.0, th * 0.4, 5), trunkMat);
    trunk.position.set(x, th * 0.2 + 7, z);
    const crown = new THREE.Mesh(new THREE.ConeGeometry(th * 0.42, th, 6), treeMat);
    crown.position.set(x, th * 0.4 + 7 + th * 0.5, z);
    isl.add(trunk, crown);
  }
  // 小房子（2~5 栋，带屋顶）
  const nHouse = 2 + (Math.random() * 4 | 0);
  for (let i = 0; i < nHouse; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.random() * size * 0.6;
    const x = cx + Math.sin(a) * d, z = cz + Math.cos(a) * d;
    const hs = 5 + Math.random() * 4;
    const body = new THREE.Mesh(new THREE.BoxGeometry(hs, hs * 0.8, hs), houseMat);
    body.position.set(x, hs * 0.4 + 7, z);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(hs * 0.85, hs * 0.6, 4), roofMat);
    roof.rotation.y = Math.PI / 4;
    roof.position.set(x, hs * 0.8 + 7 + hs * 0.3, z);
    isl.add(body, roof);
  }
  // 河流（从岛中心蜿蜒到海里的亮色带）
  if (Math.random() < 0.6) {
    const river = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, size * 1.4),
      new THREE.MeshLambertMaterial({ color: 0x3a8ab8 }));
    river.position.set(cx + (Math.random() - 0.5) * size * 0.5, 7.2, cz + size * 0.3);
    river.rotation.y = Math.random() * 0.8 - 0.4;
    isl.add(river);
  }
  isl.position.set(0, 0, 0);
  scene.add(isl);
  islands.push({ g: isl, cx, cz, size });
  return isl;
}
// 初始岛屿分布（玩家出生点周围 + 远处）
const islandSpots = [
  [1400, -2600, 420], [-1800, -3200, 520], [2600, -4400, 380],
  [-2400, -5200, 600], [800, -6400, 460], [-900, -8200, 540],
  [2200, -9600, 400], [-2600, -11000, 560],
];
for (const [x, z, s] of islandSpots) makeIsland(x, z, s);

// ---------- 航空母舰（起飞平台） ----------
const carrier = new THREE.Group();
{
  const hullMat = new THREE.MeshLambertMaterial({ color: 0x5a6a78, flatShading: true });
  const deckMat = new THREE.MeshLambertMaterial({ color: 0x9aa8b5 });
  const hull = new THREE.Mesh(new THREE.BoxGeometry(34, 12, 190), hullMat);
  hull.position.y = -6;
  const bow = new THREE.Mesh(new THREE.ConeGeometry(17, 34, 4), hullMat);
  bow.rotation.x = -Math.PI / 2; bow.rotation.y = Math.PI / 4;
  bow.position.set(0, -6, 112);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(38, 1.4, 200), deckMat);
  deck.position.y = 0.5;
  const islandTower = new THREE.Mesh(new THREE.BoxGeometry(7, 14, 22), new THREE.MeshLambertMaterial({ color: 0x6a7a8a }));
  islandTower.position.set(12, 9, 40);
  // 甲板中线
  const line = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.06, 90), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.position.set(-8, 1.25, -10);
  carrier.add(hull, bow, deck, islandTower, line);
  // 甲板上的舰载机剪影（装饰）
  for (const [dx, dz] of [[-14, 60], [14, 70]]) {
    const parked = buildFighter(0x3a5a7a, false);
    parked.scale.setScalar(0.75);
    parked.position.set(dx, 1.5, dz);
    carrier.add(parked);
  }
}
carrier.position.set(-30, 0, 60);
scene.add(carrier);

// ---------- 战斗机建模（真飞机造型：机身/机翼/尾翼/发动机/座舱） ----------
function buildFighter(color, isPlayer) {
  const g = new THREE.Group();
  const body = new THREE.MeshLambertMaterial({ color, flatShading: true });
  const dark = new THREE.MeshLambertMaterial({ color: new THREE.Color(color).multiplyScalar(0.5), flatShading: true });
  const glass = new THREE.MeshLambertMaterial({ color: 0x88c8e8, emissive: 0x1a3a4a });

  // 机身（流线型：前锥 + 中筒 + 尾锥）
  const mid = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 1.0, 9, 12), body);
  mid.rotation.x = Math.PI / 2;
  g.add(mid);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.85, 3.2, 12), body);
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = -6;
  g.add(nose);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(1.0, 3.0, 12), body);
  tail.rotation.x = Math.PI / 2;
  tail.position.z = 6;
  g.add(tail);
  // 机头空速管
  const pitot = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 4), dark);
  pitot.rotation.x = Math.PI / 2;
  pitot.position.set(0, 0.15, -8.2);
  g.add(pitot);
  // 座舱盖
  const cab = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 8), glass);
  cab.scale.set(1, 0.75, 1.7);
  cab.position.set(0, 0.85, -1.6);
  g.add(cab);
  // 主翼（后掠）
  const wingGeo = new THREE.BoxGeometry(6.8, 0.22, 3.8);
  const wingL = new THREE.Mesh(wingGeo, body);
  wingL.position.set(-4.4, 0.1, 1.2);
  wingL.rotation.y = 0.3;
  wingL.name = "wingL";
  const wingR = new THREE.Mesh(wingGeo, body);
  wingR.position.set(4.4, 0.1, 1.2);
  wingR.rotation.y = -0.3;
  wingR.name = "wingR";
  g.add(wingL, wingR);
  // 翼尖挂架（导弹挂载点）
  for (const sx of [-7.6, 7.6]) {
    const rack = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.4, 6), dark);
    rack.position.set(sx, -0.6, 1.2);
    g.add(rack);
  }
  // 水平尾翼
  for (const sx of [-1, 1]) {
    const htail = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.16, 1.6), body);
    htail.position.set(sx * 1.8, 0.3, 5.4);
    htail.rotation.y = sx * 0.25;
    g.add(htail);
  }
  // 垂尾（单垂尾，后掠）
  const vtail = new THREE.Mesh(new THREE.BoxGeometry(0.24, 2.6, 2.0), body);
  vtail.position.set(0, 1.6, 5.6);
  vtail.rotation.x = -0.18;
  g.add(vtail);
  // 发动机喷口
  const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 1.0, 10),
    new THREE.MeshLambertMaterial({ color: 0x2a2a2a }));
  nozzle.rotation.x = Math.PI / 2;
  nozzle.position.set(0, 0, 7.6);
  g.add(nozzle);
  // 发动机舱（机身两侧鼓包）
  for (const sx of [-1, 1]) {
    const eng = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.1, 3.4), dark);
    eng.position.set(sx * 0.9, -0.5, 4.6);
    g.add(eng);
  }
  g.userData.wingL = wingL;
  g.userData.wingR = wingR;
  return g;
}
const player = buildFighter(0x3a6a9a, true);
scene.add(player);

// ---------- 敌机 ----------
const enemies = [];
const enemyColors = [0x8a3a2a, 0x3a4a8a, 0x7a6a2a, 0x4a7a3a];
function spawnEnemy(type) {
  const e = buildFighter(enemyColors[(Math.random() * enemyColors.length) | 0], false);
  e.userData.type = type;
  e.userData.hp = type === "tail" ? 2 : 1;
  e.userData.firing = 0;
  e.userData.missileCd = 3 + Math.random() * 3;
  e.userData.weave = Math.random() * Math.PI * 2;
  // 相对玩家生成
  const fx = -Math.sin(P.heading), fz = -Math.cos(P.heading);
  const sx = -Math.cos(P.heading), sz = Math.sin(P.heading);
  let px, py, pz;
  const r = () => Math.random() - 0.5;
  if (type === "head") {
    px = P.pos.x + fx * (650 + Math.random() * 350) + sx * r() * 260;
    pz = P.pos.z + fz * (650 + Math.random() * 350) + sz * r() * 260;
    py = Math.max(20, P.pos.y + r() * 160);
  } else if (type === "tail") {
    px = P.pos.x - fx * 300 + sx * (r() < 0 ? 240 : -240);
    pz = P.pos.z - fz * 300 + sz * (r() < 0 ? 240 : -240);
    py = Math.max(20, P.pos.y + r() * 100);
  } else {
    const sd = r() < 0 ? 1 : -1;
    px = P.pos.x + fx * 320 + sx * sd * 200;
    pz = P.pos.z + fz * 320 + sz * sd * 200;
    py = Math.max(20, P.pos.y + r() * 100);
  }
  e.position.set(px, py, pz);
  scene.add(e);
  enemies.push(e);
  return e;
}

// ---------- 武器 ----------
const playerBullets = [], enemyBullets = [], playerMissiles = [], enemyMissiles = [], explosions = [];
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffe08a });
const eBulletMat = new THREE.MeshBasicMaterial({ color: 0xff6a4a });
const missileMat = new THREE.MeshBasicMaterial({ color: 0xff8a3a });

function fireCannon() {
  for (const sx of [-2.4, 2.4]) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 6, 5), bulletMat);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
    b.position.copy(player.position).addScaledVector(right, sx).addScaledVector(fwd, 5);
    b.userData = { vel: fwd.clone().multiplyScalar(150).addScaledVector(right, sx * 0.2), life: 1.3 };
    scene.add(b);
    playerBullets.push(b);
  }
  cannonCd = 0.09;
}

function fireMissile() {
  if (missiles <= 0) { flashMsg("MISSILES EMPTY", 900); return false; }
  missiles--;
  const m = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 3, 8), missileMat);
  body.rotation.x = Math.PI / 2;
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.8, 8), missileMat);
  tip.rotation.x = -Math.PI / 2;
  tip.position.z = -1.9;
  m.add(body, tip);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
  m.position.copy(player.position).addScaledVector(right, 2.4).addScaledVector(fwd, 5);
  m.quaternion.copy(player.quaternion);
  m.userData = { vel: fwd.clone().multiplyScalar(80).addScaledVector(right, 0.6), life: 7, target: lockTarget, turn: 2.8 };
  scene.add(m);
  playerMissiles.push(m);
  return true;
}

function spawnEnemyMissile(e) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.65, 6, 5), new THREE.MeshBasicMaterial({ color: 0xff4a4a }));
  m.position.copy(e.position);
  m.userData = { vel: P.pos.clone().sub(e.position).normalize().multiplyScalar(58), life: 9, lock: 0 };
  scene.add(m);
  enemyMissiles.push(m);
}

function boom(pos, big) {
  const n = big ? 16 : 9;
  const grp = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const s = (big ? 1.8 : 1.1) * (0.4 + Math.random() * 0.9);
    const p = new THREE.Mesh(new THREE.SphereGeometry(s, 5, 4),
      new THREE.MeshBasicMaterial({ color: i % 3 ? 0xffaa33 : 0xff5a1a, transparent: true }));
    p.position.copy(pos).add(new THREE.Vector3((Math.random() - 0.5) * 7, (Math.random() - 0.5) * 7, (Math.random() - 0.5) * 7));
    grp.add(p);
  }
  grp.userData.life = 0.6;
  scene.add(grp);
  explosions.push(grp);
}

// ---------- 补给机 ----------
let resupply = null;
function spawnResupply() {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xd8d8c8 });
  const fus = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 2.5, 28, 10), mat);
  fus.rotation.x = Math.PI / 2;
  const wing = new THREE.Mesh(new THREE.BoxGeometry(38, 0.45, 5.5), mat);
  wing.position.z = 2;
  const cab = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 6),
    new THREE.MeshLambertMaterial({ color: 0x88c8e8 }));
  cab.position.set(0, 1.2, -8);
  g.add(fus, wing, cab);
  const fx = -Math.sin(P.heading), fz = -Math.cos(P.heading);
  g.position.set(P.pos.x + fx * 700, Math.max(30, P.pos.y), P.pos.z + fz * 700);
  g.userData.docked = false;
  scene.add(g);
  resupply = g;
}

// ---------- 玩家状态 ----------
const P = {
  pos: new THREE.Vector3(-30, 9, 60),
  speed: 0, targetSpeed: 40, minSpeed: 28, maxSpeed: 95,
  afterburn: 0,
  heading: 0, pitch: 0, roll: 0, bank: 0,
  alt: 9, hp: 1, score: 0, stage: 1, stageDist: 0, invuln: 0,
};
const STAGE_LEN = 2800;
let missiles = 40;

// ---------- 输入 ----------
const keys = {};
let lockTarget = null, cannonCd = 0, demo = false;

// ---------- Demo 模式（既定指令自动演示） ----------
const DEMO_STEPS = [
  { dur: 1.2, k: "throttle" }, { dur: 2.0, k: "hold" }, { dur: 1.0, k: "climb" },
  { dur: 2.0, k: "hold" }, { dur: 0.8, k: "roll" }, { dur: 2.5, k: "aim" },
  { dur: 0.8, k: "ab" }, { dur: 2.5, k: "hold" }, { dur: 1.0, k: "dive" },
  { dur: 2.0, k: "climb" }, { dur: 1.0, k: "roll" }, { dur: 3.0, k: "aim" },
  { dur: 1.5, k: "ab" }, { dur: 2.5, k: "hold" }, { dur: 0.8, k: "climb" }, { dur: 2.5, k: "aim" },
];
const demoPlan = { step: 0, t: 0 };
function demoInput(dt) {
  demoPlan.t += dt;
  if (demoPlan.t >= DEMO_STEPS[demoPlan.step].dur) {
    demoPlan.t = 0;
    demoPlan.step = (demoPlan.step + 1) % DEMO_STEPS.length;
  }
  const inp = { left: false, right: false, up: false, down: false,
                gun: false, missile: false, afterburn: false, barrel: false };
  const st = DEMO_STEPS[demoPlan.step];
  if (st.k === "throttle" || st.k === "climb" || st.k === "ab") inp.up = true;
  if (st.k === "dive") inp.down = true;
  if (st.k === "roll") inp.barrel = true;
  if (st.k === "aim") { inp.gun = true; if (Math.random() < 0.3) inp.missile = true; }
  if (st.k === "ab") inp.afterburn = true;
  return inp;
}
function readInput(dt) {
  if (demo) return demoInput(dt);
  return {
    left: !!keys["ArrowLeft"], right: !!keys["ArrowRight"],
    up: !!keys["ArrowUp"], down: !!keys["ArrowDown"],
    gun: !!keys[" "], missile: !!keys["j"],
    afterburn: !!keys["k"], barrel: !!keys["l"],
  };
}

// ---------- HUD / 消息 ----------
const hudEl = document.getElementById("hud");
const msgEl = document.getElementById("msg");
const lockEl = document.getElementById("lockbox");
let msgTimer = null;
function flashMsg(text, ms) {
  msgEl.textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { msgEl.textContent = ""; }, ms);
}

function resetPlayer() {
  P.pos.set(-30, 9, 60);
  P.speed = 0; P.targetSpeed = 40; P.afterburn = 0;
  P.heading = 0; P.pitch = 0; P.roll = 0; P.bank = 0; P.alt = 9;
  P.hp = 1; P.score = 0; P.stage = 1; P.stageDist = 0; P.invuln = 0;
  missiles = 40;
  lockTarget = null;
  clearWorld();
  // 初始敌机
  for (let i = 0; i < 5; i++) spawnEnemy(i % 3 === 0 ? "tail" : (i % 3 === 1 ? "head" : "flank"));
}

function clearWorld() {
  for (const arr of [playerBullets, enemyBullets, playerMissiles, enemyMissiles, explosions]) {
    for (const o of arr) scene.remove(o);
    arr.length = 0;
  }
  for (const e of enemies) scene.remove(e);
  enemies.length = 0;
  if (resupply) { scene.remove(resupply); resupply = null; }
}

function setState(s, msgText) {
  STATE = s;
  if (msgText !== undefined) msgEl.textContent = msgText;
}

function onStageAdvance() {
  P.stage++;
  const n = 4 + Math.min(4, P.stage);
  for (let i = 0; i < n; i++) {
    spawnEnemy(i % 3 === 0 ? "tail" : (i % 3 === 1 ? "head" : "flank"));
  }
  // 新岛屿（玩家前方）
  const fx = -Math.sin(P.heading), fz = -Math.cos(P.heading);
  makeIsland(P.pos.x + fx * 1600 + (Math.random() - 0.5) * 600,
             P.pos.z + fz * 1600 + (Math.random() - 0.5) * 600,
             350 + Math.random() * 250);
  // 补给机：每 2 关
  if (P.stage % 2 === 0 && !resupply) {
    spawnResupply();
    flashMsg(`STAGE ${P.stage} — 补给机已就位`, 2200);
  } else {
    flashMsg(`STAGE ${P.stage}`, 1200);
  }
}

// ---------- 锁定判定（相机前方锥形内最近的敌机） ----------
function updateLock() {
  let best = null, bestD = Infinity;
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  for (const e of enemies) {
    const toE = e.position.clone().sub(camera.position);
    const dist = toE.length();
    if (dist > 1100 || dist < 1) continue;
    const proj = toE.dot(camDir);
    if (proj < 0) continue;
    const off = toE.clone().sub(camDir.clone().multiplyScalar(proj)).length();
    if (off < dist * 0.15 && dist < bestD) { best = e; bestD = dist; }
  }
  lockTarget = best;
  lockEl.style.display = best ? "block" : "none";
}

// ---------- 玩家更新 ----------
function updatePlayer(dt, inp) {
  // 速度
  if (inp.up) P.targetSpeed = Math.min(P.maxSpeed, P.targetSpeed + 30 * dt);
  if (inp.down) P.targetSpeed = Math.max(P.minSpeed, P.targetSpeed - 36 * dt);
  if (inp.afterburn) {
    P.afterburn = Math.min(2.5, P.afterburn + dt);
    P.targetSpeed = Math.min(135, P.targetSpeed + 65 * dt);
  }
  P.afterburn = Math.max(0, P.afterburn - (inp.afterburn ? 0 : 0.4 * dt));
  P.speed += (P.targetSpeed - P.speed) * Math.min(1, dt * 1.8);

  // 姿态
  const turnIn = (inp.left ? 1 : 0) - (inp.right ? 1 : 0);
  P.bank += (turnIn * 0.9 - P.bank) * Math.min(1, dt * 4);
  P.heading -= P.bank * dt * 1.1;
  if (inp.barrel) P.roll += dt * 5.2;
  else P.roll *= Math.pow(0.02, dt);
  const pitchIn = (inp.up ? 1 : 0) - (inp.down ? 1 : 0);
  P.pitch += (pitchIn * 0.5 - P.pitch) * Math.min(1, dt * 3);
  P.pitch = Math.max(-0.85, Math.min(0.85, P.pitch));

  // 位移（3D 速度方向）
  const fx = -Math.sin(P.heading) * Math.cos(P.pitch);
  const fy = Math.sin(P.pitch);
  const fz = -Math.cos(P.heading) * Math.cos(P.pitch);
  P.pos.x += fx * P.speed * dt;
  P.pos.y += fy * P.speed * dt;
  P.pos.z += fz * P.speed * dt;
  P.alt = Math.max(10, Math.min(700, P.pos.y));
  P.pos.y = P.alt;
  player.position.copy(P.pos);

  // 机体姿态
  const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), P.heading);
  const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), P.pitch);
  const qBank = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -P.bank * 0.55);
  const qRoll = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -P.roll);
  player.quaternion.copy(qYaw).multiply(qPitch).multiply(qBank).multiply(qRoll);

  // 武器
  cannonCd = Math.max(0, cannonCd - dt);
  if (inp.gun && cannonCd <= 0) fireCannon();
  if (inp.missile) fireMissile();

  updateLock();

  // 关卡
  P.stageDist += P.speed * dt;
  if (P.stageDist >= STAGE_LEN) { P.stageDist = 0; onStageAdvance(); }

  P.invuln = Math.max(0, P.invuln - dt);
}

// ---------- 敌机更新 ----------
function updateEnemies(dt) {
  const pFwd = new THREE.Vector3(
    -Math.sin(P.heading) * Math.cos(P.pitch),
    Math.sin(P.pitch),
    -Math.cos(P.heading) * Math.cos(P.pitch));
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const type = e.userData.type;
    const toP = P.pos.clone().sub(e.position);
    const dist = toP.length();

    if (type === "head") {
      // 迎面：全 3D 飞向玩家 + 机动摆动
      const dir = toP.clone().normalize();
      e.position.addScaledVector(dir, 44 * dt);
      e.userData.weave += dt * 0.9;
      const perp = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
      e.position.addScaledVector(perp, Math.sin(elapsed * 1.5 + e.userData.weave) * 34 * dt);
      e.position.y += Math.sin(elapsed * 0.8 + e.userData.weave * 2) * 24 * dt;
      e.lookAt(P.pos);
    } else if (type === "tail") {
      // 尾随：保持身后，伺机放导弹
      const desired = P.pos.clone().addScaledVector(pFwd, -300);
      desired.y = Math.max(15, desired.y);
      e.position.lerp(desired, Math.min(1, dt * 1.2));
      e.lookAt(P.pos);
      e.userData.missileCd -= dt;
      if (e.userData.missileCd <= 0 && dist < 750 && dist > 130) {
        spawnEnemyMissile(e);
        e.userData.missileCd = 4 + Math.random() * 3;
      }
    } else {
      // 侧翼：保持侧前方
      const sd = e.userData.weave > 0 ? 1 : -1;
      const sideDir = new THREE.Vector3(-Math.cos(P.heading), 0, Math.sin(P.heading)).multiplyScalar(sd);
      const desired = P.pos.clone().addScaledVector(pFwd, 220).addScaledVector(sideDir, 160);
      desired.y = Math.max(15, P.pos.y + 10);
      e.position.lerp(desired, Math.min(1, dt * 1.5));
      e.lookAt(P.pos);
    }

    // 开火（近距离机枪）
    e.userData.firing -= dt;
    if (dist < 240 && e.userData.firing <= 0) {
      e.userData.firing = 0.5;
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.45, 5, 4), eBulletMat);
      b.position.copy(e.position);
      b.userData = { vel: toP.clone().normalize().multiplyScalar(100), life: 2.2 };
      scene.add(b);
      enemyBullets.push(b);
    }

    // 被击落
    if (e.userData.hp <= 0) {
      boom(e.position, true);
      P.score += 500 * P.stage;
      scene.remove(e);
      enemies.splice(i, 1);
      if (lockTarget === e) lockTarget = null;
      continue;
    }
    if (dist > 2800) { scene.remove(e); enemies.splice(i, 1); }
  }
}

// ---------- 子弹/导弹更新 ----------
function updateBullets(dt) {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.position.addScaledVector(b.userData.vel, dt);
    b.userData.life -= dt;
    let dead = b.userData.life <= 0;
    if (!dead) {
      for (const e of enemies) {
        if (b.position.distanceTo(e.position) < 8) {
          e.userData.hp -= 1;
          P.score += 50;
          boom(b.position, false);
          dead = true;
          break;
        }
      }
    }
    if (dead) { scene.remove(b); playerBullets.splice(i, 1); }
  }
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.position.addScaledVector(b.userData.vel, dt);
    b.userData.life -= dt;
    let dead = b.userData.life <= 0;
    if (!dead && b.position.distanceTo(P.pos) < 7 && P.invuln <= 0) {
      dead = true;
      playerHit();
    }
    if (dead) { scene.remove(b); enemyBullets.splice(i, 1); }
  }
}

function updateMissiles(dt) {
  for (let i = playerMissiles.length - 1; i >= 0; i--) {
    const m = playerMissiles[i];
    const u = m.userData;
    u.life -= dt;
    if (u.target && enemies.includes(u.target)) {
      const toT = u.target.position.clone().sub(m.position).normalize();
      u.vel.lerp(toT.multiplyScalar(100), Math.min(1, u.turn * dt));
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), u.vel.clone().normalize());
    }
    m.position.addScaledVector(u.vel, dt);
    let dead = u.life <= 0;
    if (!dead && u.target && enemies.includes(u.target) && m.position.distanceTo(u.target.position) < 9) {
      u.target.userData.hp -= 1;
      P.score += 300;
      boom(m.position, true);
      if (u.target === lockTarget) lockTarget = null;
      dead = true;
    }
    if (dead) { scene.remove(m); playerMissiles.splice(i, 1); }
  }
  for (let i = enemyMissiles.length - 1; i >= 0; i--) {
    const m = enemyMissiles[i];
    const u = m.userData;
    u.life -= dt;
    const toP = P.pos.clone().sub(m.position);
    const dist = toP.length();
    // 原版精髓：敌弹锁定玩家，改变速度/桶滚可甩脱
    const speedDelta = Math.abs(P.speed - 55);
    u.lock = Math.max(0, Math.min(1, u.lock + (dist < 420 ? dt * 0.8 : -dt * 0.3)));
    if (speedDelta > 25 || Math.abs(P.roll) > 0.6) u.lock = Math.max(0, u.lock - dt * 1.6);
    u.vel.lerp(toP.clone().normalize().multiplyScalar(58), Math.min(1, u.lock * dt * 2));
    m.position.addScaledVector(u.vel, dt);
    let dead = u.life <= 0;
    if (!dead && dist < 8 && P.invuln <= 0) {
      dead = true;
      playerHit();
    }
    if (dead) { scene.remove(m); enemyMissiles.splice(i, 1); }
  }
}

function playerHit() {
  if (P.invuln > 0) return;
  boom(P.pos, true);
  if (demo) { resetPlayer(); STATE = "PLAYING"; return; }
  P.hp = 0;
  P.invuln = 0.8;
  setState("GAMEOVER", "GAME OVER\n按 ENTER 重新开始");
}

// ---------- 补给机更新 ----------
function updateResupply(dt) {
  if (!resupply) return;
  const u = resupply.userData;
  if (!u.docked) {
    const toP = P.pos.clone().sub(resupply.position);
    const d = toP.length();
    if (d > 95) {
      resupply.position.addScaledVector(toP.normalize(), 28 * dt);
      resupply.lookAt(P.pos);
    } else {
      u.docked = true;
      missiles = Math.min(99, missiles + 50);
      P.score += 1000;
      flashMsg("RESUPPLY +50 MISSILES", 2000);
      u.fade = 1.6;
    }
  } else {
    u.fade -= dt;
    resupply.children.forEach(c => { if (c.material) { c.material.transparent = true; c.material.opacity = Math.max(0, u.fade / 1.6); } });
    resupply.position.y += 7 * dt;
    if (u.fade <= 0) { scene.remove(resupply); resupply = null; }
  }
}

// ---------- 爆炸更新 ----------
function updateExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    const g = explosions[i];
    g.userData.life -= dt;
    g.scale.multiplyScalar(1 + dt * 5);
    g.children.forEach(c => { if (c.material.transparent) c.material.opacity = Math.max(0, g.userData.life / 0.6); });
    if (g.userData.life <= 0) { scene.remove(g); explosions.splice(i, 1); }
  }
}

// ---------- 岛屿回收 ----------
let islandAcc = 0;
function updateIslands(dt) {
  islandAcc += P.speed * dt;
  if (islandAcc > 2400) {
    islandAcc = 0;
    // 回收最远的岛
    if (islands.length > 10) {
      let farIdx = 0, farD = -1;
      islands.forEach((isl, idx) => {
        const d = (isl.cx - P.pos.x) ** 2 + (isl.cz - P.pos.z) ** 2;
        if (d > farD) { farD = d; farIdx = idx; }
      });
      scene.remove(islands[farIdx].g);
      islands.splice(farIdx, 1);
    }
    // 前方补新岛
    const fx = -Math.sin(P.heading), fz = -Math.cos(P.heading);
    makeIsland(P.pos.x + fx * 2200 + (Math.random() - 0.5) * 900,
               P.pos.z + fz * 2200 + (Math.random() - 0.5) * 900,
               320 + Math.random() * 280);
  }
}

// ---------- 云漂移 ----------
function updateClouds(dt) {
  for (const c of clouds) {
    c.position.x += 4 * dt;
    if (c.position.distanceTo(camera.position) > 4200) {
      c.position.set(camera.position.x + (Math.random() - 0.5) * 3600,
                     260 + Math.random() * 220,
                     camera.position.z + (Math.random() - 0.5) * 3600);
    }
  }
}

// ---------- 相机 ----------
function updateCamera(dt) {
  const up = new THREE.Vector3(0, 1, 0);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
  const dist = 26 + Math.max(0, (P.speed - 60) * 0.15) + (P.afterburn > 0 ? 8 : 0);
  const height = 10 + dist * 0.3;
  camPos.copy(player.position)
    .addScaledVector(fwd, -dist)
    .addScaledVector(up, height)
    .addScaledVector(right, P.bank * 4);
  camera.position.lerp(camPos, Math.min(1, dt * 5));
  camLook.copy(player.position).addScaledVector(fwd, 24);
  camera.lookAt(camLook);
  sky.position.copy(camera.position);
  sunMesh.position.copy(camera.position).addScaledVector(sunDir, 6000);
  sunGlow.position.copy(sunMesh.position);
  camera.fov = 64 + (P.afterburn > 0 ? 5 : 0);
  camera.updateProjectionMatrix();
}
const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();

// ---------- HUD ----------
function renderHUD() {
  const ab = P.afterburn > 0 ? " ★AB" : "";
  let s = `SCORE ${P.score}\nSTAGE ${P.stage}\nSPEED ${P.speed.toFixed(0)}${ab}\n`;
  s += `MISSILES ${missiles}\nALT ${P.alt.toFixed(0)}`;
  if (lockTarget) s += `\n■ LOCK ON`;
  hudEl.textContent = s;
}

// ---------- 主循环 ----------
let lastT = performance.now();
let elapsed = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  let dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  elapsed += dt;

  if (STATE === "PLAYING") {
    updatePlayer(dt, readInput(dt));
    updateEnemies(dt);
    updateBullets(dt);
    updateMissiles(dt);
    updateResupply(dt);
    updateExplosions(dt);
    updateIslands(dt);
    updateClouds(dt);
    updateCamera(dt);
    renderHUD();
  } else if (STATE === "TAKEOFF") {
    const inp = demo
      ? readInput(dt)
      : { left: false, right: false, up: true, down: false,
          gun: false, missile: false, afterburn: true, barrel: false };
    updatePlayer(dt, inp);
    updateClouds(dt);
    updateCamera(dt);
    renderHUD();
    if (P.pos.z < carrier.position.z - 80) {
      setState("PLAYING", demo ? "DEMO — 自动演示中" : "LAUNCH — 加油，飞行员！");
      flashMsg(msgEl.textContent, 1500);
    }
  } else if (STATE === "TITLE" || STATE === "GAMEOVER") {
    // 背景巡航
    P.pos.z -= 10 * dt;
    player.position.copy(P.pos);
    updateClouds(dt);
    updateCamera(dt);
  }

  renderer.render(scene, camera);
}

// ---------- 事件 ----------
window.addEventListener("keydown", (ev) => {
  const k = ev.key;
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) ev.preventDefault();
  keys[k] = true;
  if (k === "Enter") {
    if (STATE === "TITLE" || STATE === "GAMEOVER") {
      resetPlayer();
      demoPlan.step = 0; demoPlan.t = 0;
      setState("TAKEOFF", "弹射起飞…");
    }
  }
  if (k === "m") {
    demo = !demo;
    if (demo) {
      demoPlan.step = 0; demoPlan.t = 0;
      if (STATE === "TITLE") {
        resetPlayer();
        setState("TAKEOFF", "DEMO — 自动演示");
      }
    }
    flashMsg(demo ? "DEMO MODE ON" : "DEMO MODE OFF", 1200);
  }
});
window.addEventListener("keyup", (ev) => { keys[ev.key] = false; });

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

// ---------- 启动 ----------
setState("TITLE", "SKY STRIKER 3D\n\nENTER 起飞    M 演示模式\n\n↑↓ 油门/俯仰  ←→ 转向  空格 机枪\nJ 导弹(需锁定)  K 加力  L 桶滚");
player.position.set(0, 34, 130);
player.rotation.y = 0.35;
frame();
</script>
